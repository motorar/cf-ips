name: Extract JP IPs

on:
  schedule:
    - cron: '10 0 * * *'
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download, Test and Filter
        run: |
          set -euo pipefail

          URL="https://bestcf.pages.dev/s5gy/jp.txt"

          echo "开始下载 IP 列表..."
          curl -fsSL \
            --retry 3 \
            --retry-delay 3 \
            --connect-timeout 15 \
            --max-time 30 \
            "$URL" \
            -o all.txt

          echo "下载完成，原始文件行数：$(wc -l < all.txt)"

          # 1. 严格清洗提取所有日本 IP:Port，去重
          tr -d '\r' < all.txt | awk '
          BEGIN { IGNORECASE = 1 }
          /JP|Japan|日本/ {
            line = $1
            sub(/#.*/, "", line)
            if (line ~ /^[0-9a-zA-Z\.\:]+:[0-9]+$/) {
              if (!seen[line]++) {
                print line
              }
            }
          }
          ' > candidate_ips.txt

          TOTAL_CANDIDATES=$(wc -l < candidate_ips.txt || echo 0)
          echo "共清洗出有效日本候选节点：$TOTAL_CANDIDATES 个"

          if [ "$TOTAL_CANDIDATES" -eq 0 ]; then
            echo "::error::未找到任何日本/JP节点，流程终止！"
            rm -f all.txt candidate_ips.txt
            exit 1
          fi

          # 抽取 20 个样本快速测速
          TEST_SAMPLE=$(( TOTAL_CANDIDATES < 20 ? TOTAL_CANDIDATES : 20 ))
          shuf -n "$TEST_SAMPLE" candidate_ips.txt > sample_ips.txt

          echo "正在对抽取的 $TEST_SAMPLE 个样本节点进行极速连通性测试..."

          cat << 'EOF' > test_ping.sh
          #!/usr/bin/env bash
          line="$1"
          ip="${line%:*}"
          port="${line#*:}"

          latency=$(curl -s -o /dev/null -w "%{time_connect}" --connect-timeout 1.5 -m 2 "http://$ip:$port" 2>/dev/null || echo "")

          if [ -n "$latency" ] && [ "$latency" != "0.000" ]; then
            echo "$latency $line"
          fi
          EOF
          chmod +x test_ping.sh

          xargs -P 20 -n 1 ./test_ping.sh < sample_ips.txt | sort -n > alive_ips.txt || true

          ALIVE_COUNT=$(wc -l < alive_ips.txt || echo 0)
          echo "测速完毕，响应合格的存活节点数：$ALIVE_COUNT 个"

          if [ "$ALIVE_COUNT" -ge 1 ]; then
            head -n 4 alive_ips.txt | awk '{print $2}' > top_ips.txt
          else
            echo "::warning::样本测速未响应，触发保底机制，直接提取 4 个候选节点..."
            shuf -n 4 candidate_ips.txt > top_ips.txt
          fi

          # 格式化输出：截取纯 IP 并追加到备注末尾
          awk '
          BEGIN {
            split("第一 第二 第三 第四", c, " ")
          }
          {
            tag = (NR <= 4 && c[NR] != "") ? c[NR] : NR
            ip = $0
            sub(/:[0-9]+$/, "", ip)
            print $0 "#日本" tag ip
          }
          ' top_ips.txt > jp_ips.txt

          # 清理临时文件
          rm -f all.txt candidate_ips.txt sample_ips.txt test_ping.sh alive_ips.txt top_ips.txt

          echo ""
          echo "================ 最终优选出的 4 个日本节点 ================"
          cat jp_ips.txt
          echo "=========================================================="

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add jp_ips.txt

          if git diff --cached --quiet; then
            echo "日本 IP 列表没有变化，无需提交。"
            exit 0
          fi

          git commit -m "Update JP IP list (Fast-tested) $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push
