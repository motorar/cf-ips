name: Extract JP IPs

on:
  schedule:
    - cron: '10 0 * * *'
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download and Filter
        run: |
          set -euo pipefail

          URL="https://bestcf.pages.dev/moistr/all.txt"

          echo "开始下载 IP 列表..."
          curl -fsSL \
            --retry 3 \
            --retry-delay 3 \
            --connect-timeout 20 \
            --max-time 60 \
            "$URL" \
            -o all.txt

          echo "下载完成，原始文件行数："
          wc -l all.txt

          echo "开始清洗并筛选 JP / 日本节点..."

          # 1. tr -d '\r' 清除 Windows 回车符，防止格式被污染
          # 2. 忽略大小写匹配 JP、Japan、日本等地区标识
          # 3. 提取有效 IP:Port，过滤纯注释行与空行，并去重
          tr -d '\r' < all.txt | awk '
          BEGIN { IGNORECASE = 1 }
          /JP|Japan|日本/ {
            line = $1
            # 去掉原有 # 及其后面的备注
            sub(/#.*/, "", line)

            # 严格校验：确保提取内容非空且包含冒号端口（避免匹配到开头的纯注释行）
            if (line ~ /^[0-9a-zA-Z\.\:]+:[0-9]+$/) {
              if (!seen[line]++) {
                print line
              }
            }
          }
          ' > candidate_ips.txt

          TOTAL_FOUND=$(wc -l < candidate_ips.txt || echo 0)
          echo "筛选出不重复的有效日本节点数：$TOTAL_FOUND"

          if [ "$TOTAL_FOUND" -eq 0 ]; then
            echo "::error::未找到任何日本/JP节点，流程终止！"
            rm -f all.txt candidate_ips.txt
            exit 1
          fi

          # 随机抽取最多 4 个节点（不足 4 个则取全部）
          PICK_NUM=$(( TOTAL_FOUND < 4 ? TOTAL_FOUND : 4 ))
          shuf -n "$PICK_NUM" candidate_ips.txt | awk '
          BEGIN {
            split("第一 第二 第三 第四", c, " ")
          }
          {
            tag = (NR <= 4 && c[NR] != "") ? c[NR] : NR
            print $0 "#日本" tag
          }
          ' > jp_ips.txt

          # 清理临时文件
          rm -f all.txt candidate_ips.txt

          echo ""
          echo "提取完成，最终生成的日本节点预览："
          cat jp_ips.txt

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add jp_ips.txt

          if git diff --cached --quiet; then
            echo "日本 IP 列表没有变化，无需提交。"
            exit 0
          fi

          git commit -m "Update JP IP list $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push
